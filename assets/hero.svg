<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">Shiva Balamoni</title>
  <desc id="d">Founder and CEO of Balamonis LLC and Lexora AI LLC. I build companies that solve problems worth solving and saving.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#1a0f33"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf5d4"/>
      <stop offset="0.5" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#c78bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6aa8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6aa8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6aa8ff" stroke-opacity="0.07"/>
    </pattern>
    <style>
      .name{font:800 64px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-1px}
      .tag{font:500 20px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#c9d4f5}
      .pill{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e8eeff;letter-spacing:.6px}
      .eyebrow{font:700 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#7cf5d4;letter-spacing:4px}
      .rise{opacity:0;animation:rise .9s ease-out forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}
      .orbit{transform-origin:830px 170px;animation:spin 40s linear infinite}
      .orbit2{transform-origin:830px 170px;animation:spin 26s linear infinite reverse}
      .pulse{animation:pulse 3s ease-in-out infinite}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1000" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="340" rx="22" fill="url(#grid)"/>
  <circle cx="830" cy="170" r="190" fill="url(#glow)"/>

  <!-- orbital system -->
  <g fill="none" stroke="#6aa8ff" stroke-opacity="0.35">
    <circle cx="830" cy="170" r="60"/>
    <circle cx="830" cy="170" r="105" stroke-dasharray="3 7"/>
    <circle cx="830" cy="170" r="150" stroke-opacity="0.18"/>
  </g>
  <circle class="pulse" cx="830" cy="170" r="16" fill="url(#ink)"/>
  <circle cx="830" cy="170" r="7" fill="#070b18"/>
  <g class="orbit">
    <circle cx="830" cy="65" r="9" fill="#7cf5d4"/>
    <circle cx="935" cy="170" r="5" fill="#6aa8ff"/>
  </g>
  <g class="orbit2">
    <circle cx="830" cy="20" r="7" fill="#c78bff"/>
    <circle cx="725" cy="170" r="6" fill="#7cf5d4"/>
    <circle cx="830" cy="275" r="4" fill="#6aa8ff"/>
  </g>

  <!-- copy -->
  <text class="eyebrow rise d1" x="56" y="78">FOUNDER · BUILDER · EDUCATOR</text>
  <text class="name rise d2" x="56" y="150" fill="url(#ink)">Shiva Balamoni</text>
  <text class="tag rise d3" x="56" y="192">I build companies that solve problems</text>
  <text class="tag rise d3" x="56" y="220">worth solving, and worth saving.</text>

  <g class="rise d4">
    <rect x="56" y="250" width="156" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#7cf5d4" stroke-opacity="0.6"/>
    <text class="pill" x="134" y="272" text-anchor="middle">LEXORA AI LLC</text>
    <rect x="224" y="250" width="164" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#6aa8ff" stroke-opacity="0.6"/>
    <text class="pill" x="306" y="272" text-anchor="middle">BALAMONIS LLC</text>
    <rect x="400" y="250" width="176" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#c78bff" stroke-opacity="0.6"/>
    <text class="pill" x="488" y="272" text-anchor="middle">THE SCHOOL · SOON</text>
  </g>
</svg>
